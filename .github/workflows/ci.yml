name: CI Nexio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - run: npx prisma generate

      # Audit de sécurité des dépendances : bloque la CI dès qu'une vulnérabilité haute ou critique
      # est présente (règle « Harnais de tests » point 3).
      - name: npm audit (backend)
        continue-on-error: true  # informe sans bloquer tant que les montées majeures (zod 4, Prisma 7) ne sont pas faites ; à remettre bloquant ensuite
        run: npm audit --audit-level=high

      # Aucune clé réelle ni accès réseau : Groq, Prisma et l'email sont mockés
      # (les cas Groq réels sont derrière RUN_GROQ_LIVE=1, jamais en CI).
      - run: npm test

      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - name: npm audit (frontend)
        continue-on-error: true  # informe sans bloquer tant que les montées majeures (zod 4, Prisma 7) ne sont pas faites ; à remettre bloquant ensuite
        run: npm audit --audit-level=high

      - run: npm run build
