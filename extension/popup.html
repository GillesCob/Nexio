<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Nexio – Extraction LinkedIn</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        width: 280px;
        padding: 12px;
        margin: 0;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
      }
      button:hover {
        background: #ebebeb;
      }
      #diagnose-btn {
        margin-top: 8px;
        font-size: 12px;
        background: none;
        border: none;
        color: #666;
        text-decoration: underline;
        padding: 4px;
      }
      #next-step button {
        background: #e8f0fe;
        border-color: #a8c7fa;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
        min-height: 32px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <button id="extract-btn">Extraire et envoyer à Nexio</button>
    <div id="status"></div>
    <div id="next-step"></div>
    <button id="diagnose-btn">Diagnostic (si le résultat n'est pas bon)</button>
    <script src="popup.js"></script>
  </body>
</html>
